[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110",
  "httpx>=0.27",
  "markdown-it-py>=3,<5",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2",
  "SQLAlchemy>=2,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*Using.*httpx.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]
