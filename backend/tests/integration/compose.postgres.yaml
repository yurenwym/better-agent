services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: better_agent_test
      POSTGRES_USER: better_agent_test
      POSTGRES_PASSWORD: better_agent_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better_agent_test -d better_agent_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
